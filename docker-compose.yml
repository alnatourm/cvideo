services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvideo
      POSTGRES_USER: cvideo
      POSTGRES_PASSWORD: cvideo_local
    ports:
      - "5432:5432"
    volumes:
      - cvideo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvideo -d cvideo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cvideo_pgdata:
