name: CVIDEO CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cvideo
          POSTGRES_PASSWORD: cvideo
          POSTGRES_DB: cvideo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cvideo:cvideo@localhost:5432/cvideo
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0001_candidate_profile_core.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0002_identity_tenant_security.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0003_candidate_discovery_settings.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0004_saved_lists.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0005_messaging.sql
      - name: Verify migrated schema and security relationships
        run: |
          psql "$DATABASE_URL" -Atc "select to_regclass('public.candidate_profiles');" | grep -qx candidate_profiles
          psql "$DATABASE_URL" -Atc "select to_regclass('public.candidate_videos');" | grep -qx candidate_videos
          psql "$DATABASE_URL" -Atc "select to_regclass('public.users');" | grep -qx users
          psql "$DATABASE_URL" -Atc "select to_regclass('public.companies');" | grep -qx companies
          psql "$DATABASE_URL" -Atc "select to_regclass('public.company_members');" | grep -qx company_members
          psql "$DATABASE_URL" -Atc "select to_regclass('public.sessions');" | grep -qx sessions
          psql "$DATABASE_URL" -Atc "select to_regclass('public.candidate_discovery_settings');" | grep -qx candidate_discovery_settings
          psql "$DATABASE_URL" -Atc "select to_regclass('public.saved_lists');" | grep -qx saved_lists
          psql "$DATABASE_URL" -Atc "select to_regclass('public.saved_candidates');" | grep -qx saved_candidates
          psql "$DATABASE_URL" -Atc "select to_regclass('public.conversations');" | grep -qx conversations
          psql "$DATABASE_URL" -Atc "select to_regclass('public.messages');" | grep -qx messages
          psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname = 'candidate_profiles_user_fk';" | grep -qx 1
          psql "$DATABASE_URL" -Atc "select count(*) from pg_indexes where indexname = 'company_members_user_unique' and indexdef ilike 'CREATE UNIQUE INDEX%';" | grep -qx 1
          psql "$DATABASE_URL" -Atc "select count(*) from information_schema.columns where table_name = 'candidate_discovery_settings' and column_name = 'discoverable' and column_default = 'false';" | grep -qx 1
          psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conrelid = 'public.saved_lists'::regclass and contype = 'f';" | grep -qE '^[2-9][0-9]*$'
          psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conrelid = 'public.saved_candidates'::regclass and contype in ('p','f');" | grep -qE '^[3-9][0-9]*$'
          psql "$DATABASE_URL" -Atc "select count(*) from pg_indexes where indexname = 'conversations_company_candidate_unique' and indexdef ilike 'CREATE UNIQUE INDEX%';" | grep -qx 1
          psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conrelid = 'public.messages'::regclass and contype = 'f';" | grep -qE '^[2-9][0-9]*$'
