name: Fix Agent Executor

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: QC defect issue number to claim
        required: true
        type: number
      qc_signature:
        description: Stable QC defect signature
        required: true
        type: string
      source_sha:
        description: Commit SHA that failed QC
        required: true
        type: string
      severity:
        description: BLOCKER, HIGH, MEDIUM or LOW
        required: true
        type: choice
        options: [BLOCKER, HIGH, MEDIUM, LOW]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fix-agent-${{ inputs.issue_number }}-${{ inputs.qc_signature }}
  cancel-in-progress: false

jobs:
  prepare-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIX_BRANCH: factory/fix-${{ inputs.issue_number }}-${{ inputs.qc_signature }}
      BASE_BRANCH: deploy/railway-staging-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate claim
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.qc_signature }}" =~ ^[a-f0-9]{12}$ ]] || { echo 'Invalid QC signature'; exit 1; }
          git cat-file -e "${{ inputs.source_sha }}^{commit}" || { echo 'Source SHA is not present in repository'; exit 1; }
          if [[ "$FIX_BRANCH" == "main" || "$FIX_BRANCH" == "$BASE_BRANCH" ]]; then exit 1; fi
      - name: Create isolated repair branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$FIX_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$FIX_BRANCH:$FIX_BRANCH"
            git checkout "$FIX_BRANCH"
          else
            git checkout -b "$FIX_BRANCH"
            git push -u origin "$FIX_BRANCH"
          fi
      - name: Fetch defect contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qc-evidence
          gh issue view "${{ inputs.issue_number }}" --json number,title,body,url,state > qc-evidence/fix-agent-issue.json
          node -e "const i=require('./qc-evidence/fix-agent-issue.json'); if(!i.body.includes('cvideo-qc-signature:${{ inputs.qc_signature }}')) { console.error('Issue/signature mismatch'); process.exit(1) }"
      - name: Write executor claim
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const issue=require('./qc-evidence/fix-agent-issue.json');
          const claim={schemaVersion:1,state:'CLAIMED',issueNumber:issue.number,issueUrl:issue.url,signature:'${{ inputs.qc_signature }}',severity:'${{ inputs.severity }}',sourceSha:'${{ inputs.source_sha }}',branch:process.env.FIX_BRANCH,baseBranch:process.env.BASE_BRANCH,runUrl:'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',guardrails:['no direct main/release commits','no QC disabling','no assertion weakening to hide defects','no auth/security bypass','no secret exposure','no self merge','no production approval'],claimedAt:new Date().toISOString()};
          fs.writeFileSync('qc-evidence/fix-agent-claim.json',JSON.stringify(claim,null,2));
          NODE
      - name: Comment claim on defect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ inputs.issue_number }}" --body "🔧 Fix Agent claimed QC signature \`${{ inputs.qc_signature }}\` on branch \`$FIX_BRANCH\`. Executor run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The agent may prepare a repair PR but cannot self-merge or approve production."
      - name: Upload repair workspace contract
        uses: actions/upload-artifact@v4
        with:
          name: fix-agent-claim-${{ inputs.issue_number }}-${{ inputs.qc_signature }}
          path: qc-evidence/
          retention-days: 14
