name: Browser QC Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: CVIDEO deployment URL to test
        required: false
        default: https://cvideoapi-production.up.railway.app

permissions:
  contents: read

jobs:
  browser-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CVIDEO_QC_BASE_URL: ${{ inputs.base_url || 'https://cvideoapi-production.up.railway.app' }}
      CVIDEO_QC_CANDIDATE_EMAIL: ${{ secrets.CVIDEO_QC_CANDIDATE_EMAIL }}
      CVIDEO_QC_CANDIDATE_PASSWORD: ${{ secrets.CVIDEO_QC_CANDIDATE_PASSWORD }}
      CVIDEO_QC_RECRUITER_EMAIL: ${{ secrets.CVIDEO_QC_RECRUITER_EMAIL }}
      CVIDEO_QC_RECRUITER_PASSWORD: ${{ secrets.CVIDEO_QC_RECRUITER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Public browser QC
        run: pnpm qc:browser
      - name: Upload QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qc-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
