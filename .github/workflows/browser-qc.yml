name: Browser QC Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: CVIDEO deployment URL to test
        required: false
        default: https://cvideoapi-production.up.railway.app
      require_authenticated_qc:
        description: Block unless Candidate + Recruiter QC executes
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CVIDEO_QC_BASE_URL: ${{ inputs.base_url || 'https://cvideoapi-production.up.railway.app' }}
      CVIDEO_QC_REQUIRE_AUTH: ${{ inputs.require_authenticated_qc || 'false' }}
      CVIDEO_QC_CANDIDATE_EMAIL: ${{ secrets.CVIDEO_QC_CANDIDATE_EMAIL }}
      CVIDEO_QC_CANDIDATE_PASSWORD: ${{ secrets.CVIDEO_QC_CANDIDATE_PASSWORD }}
      CVIDEO_QC_RECRUITER_EMAIL: ${{ secrets.CVIDEO_QC_RECRUITER_EMAIL }}
      CVIDEO_QC_RECRUITER_PASSWORD: ${{ secrets.CVIDEO_QC_RECRUITER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect authenticated QC configuration
        id: auth
        shell: bash
        run: |
          if [[ -n "$CVIDEO_QC_CANDIDATE_EMAIL" && -n "$CVIDEO_QC_CANDIDATE_PASSWORD" && -n "$CVIDEO_QC_RECRUITER_EMAIL" && -n "$CVIDEO_QC_RECRUITER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated QC secrets are not configured; public browser QC will still run."
          fi
      - name: Provision dedicated QC identities
        if: steps.auth.outputs.configured == 'true'
        run: node scripts/qc-provision.mjs
      - name: Install browser QC runner
        working-directory: tests/browser-qc
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/browser-qc
        run: npx playwright install --with-deps chromium
      - name: Run browser QC
        id: playwright
        continue-on-error: true
        working-directory: tests/browser-qc
        run: npm test
      - name: Evaluate Factory release gate
        if: always()
        env:
          CVIDEO_QC_RESULTS: tests/browser-qc/test-results/results.json
        run: node scripts/qc-release-gate.mjs
      - name: Upload QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qc-${{ github.run_id }}
          path: |
            tests/browser-qc/playwright-report/
            tests/browser-qc/test-results/
            qc-evidence/
          if-no-files-found: ignore
          retention-days: 14
